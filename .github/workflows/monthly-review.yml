name: monthly manual review

# The daily sync handles everything that follows upstream. This is the standing
# list of what it CANNOT handle, opened once a month so it is a task with a date
# rather than something someone is supposed to remember.
on:
  schedule:
    # 1st of each month, 04:00 UTC — an hour after the daily sync, so the issue
    # reports the state the sync just left behind.
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect what still needs a human
        run: python3 scripts/monthly_report.py > report.md

      - name: Open this month's review issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8').slice(0, 60000);
            const now = new Date().toISOString().slice(0, 7);
            // A new issue per month, deliberately: last month's should close
            // when it is done, not be overwritten by this month's list.
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Monthly rule review — ${now}`,
              body, labels: ['monthly-review'],
            });
