name: publish catalog

# The repo's whole job: keep dist/catalog.json on the `rule-set` branch current,
# without anyone having to remember to do it. Clients poll that branch.
#
# Once a day it also re-aligns the packs with the upstream community lists
# (v2fly/domain-list-community, MIT) so a dead domain does not sit in a pack
# until someone happens to notice. A daily unattended edit of everyone's
# routing needs a guard, so scripts/guard_changes.py holds anything that looks
# like an upstream breakage instead of publishing it.
on:
  push:
    branches: [main]
  schedule:
    # 03:00 UTC daily: sync with upstream, then publish if the diff looks sane.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the currently published catalog
        # Feeds both the build (per-pack change dates are carried over for packs
        # whose content did not change) and the guard (what "changed" means).
        run: |
          git fetch -q origin rule-set 2>/dev/null || true
          git show origin/rule-set:catalog.json > /tmp/previous-catalog.json 2>/dev/null || true

      - name: Align packs with upstream
        # Only on the scheduled/manual run: a human push should publish exactly
        # what the human wrote, not that plus whatever upstream did overnight.
        if: github.event_name != 'push'
        run: python3 scripts/sync_upstream.py

      - name: Build catalog
        # Validation lives in the build script (unknown fields, empty packs,
        # ids that disagree with their file name, one domain routed two ways).
        # A bad source fails HERE, where the diff that caused it is on screen —
        # never on a user's device.
        run: |
          python3 scripts/build_catalog.py --out dist/catalog.json \
            --previous /tmp/previous-catalog.json

      - name: Check the diff is not an upstream accident
        id: guard
        # A manual run counts as reviewed — it publishes
        # regardless. Scheduled runs must clear the limits.
        run: |
          set +e
          python3 scripts/guard_changes.py \
            --new dist/catalog.json --old /tmp/previous-catalog.json > /tmp/report.md
          code=$?
          set -e
          cat /tmp/report.md
          if [ "$code" = "10" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "hold=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" != "0" ] && [ "$code" != "10" ]; then
            exit "$code"
          fi

      - name: Open a review issue and stop
        if: steps.guard.outputs.hold == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/report.md', 'utf8').slice(0, 60000);
            const title = 'Upstream sync held back for review';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'sync-hold',
            });
            if (open.data.length) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['sync-hold'],
              });
            }

      - name: Stop here when held
        if: steps.guard.outputs.hold == 'true'
        run: |
          echo "held for review — see the sync-hold issue"
          exit 0

      - name: Commit the synced sources
        # The generated lists live in git so the daily upstream movement is
        # reviewable after the fact, not just visible as a version bump.
        # [skip ci] keeps this commit from re-triggering the workflow.
        if: github.event_name != 'push' && steps.guard.outputs.hold != 'true'
        run: |
          set -euo pipefail
          git config user.name "AiPo"
          git config user.email "aipo@ailenshow.com"
          if git diff --quiet -- sources; then
            echo "sources unchanged"
          else
            git add sources
            git commit -qm "sync: align packs with upstream [skip ci]"
            git push -q origin HEAD:main
          fi

      - name: Publish to the rule-set branch
        run: |
          set -euo pipefail
          git config user.name "AiPo"
          git config user.email "aipo@ailenshow.com"
          NEW_VERSION="$(python3 -c 'import json;print(json.load(open("dist/catalog.json"))["version"])')"
          # Compare VERSIONS, not files: generatedAt moves on every run, so the
          # catalog is never byte-identical and a file comparison would commit
          # a no-op every single day. The version carries a digest of the pack
          # content, so equal version == nothing actually changed.
          OLD_VERSION="$(python3 -c 'import json,sys;print(json.load(open("/tmp/previous-catalog.json")).get("version",""))' 2>/dev/null || true)"
          if [ -n "$OLD_VERSION" ] && [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "catalog unchanged ($NEW_VERSION) — nothing to publish"
            exit 0
          fi
          # An orphan branch holding only the artifact: clients fetch one file
          # and shouldn't drag the source history along with it.
          git checkout -q --orphan rule-set-tmp
          git rm -rq --cached . || true
          cp dist/catalog.json /tmp/catalog.json
          git rm -rq --ignore-unmatch . >/dev/null 2>&1 || true
          cp /tmp/catalog.json catalog.json
          git add -f catalog.json
          git commit -qm "catalog $NEW_VERSION"
          git push -f origin rule-set-tmp:rule-set
          echo "published $NEW_VERSION"

  review-domains:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Look for names that stopped resolving
        id: check
        run: |
          python3 scripts/check_domains.py --json report.json | tee findings.txt
          echo "count=$(python3 -c 'import json;print(len(json.load(open("report.json"))))')" >> "$GITHUB_OUTPUT"

      - name: Open a review issue
        # Advisory only — see the script's header for what this can and cannot
        # detect. Nothing is ever removed automatically.
        if: steps.check.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = [
              'These pack entries stopped resolving (apex and `www.` both absent).',
              'This is a prompt to look, not an instruction to delete: a name can',
              'be unreachable from one network and healthy from another.',
              '',
              '```',
              fs.readFileSync('findings.txt', 'utf8').trim(),
              '```',
            ].join('\n');
            const title = 'Domain review: entries that stopped resolving';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'domain-review',
            });
            // Update the standing issue rather than opening one a day.
            if (open.data.length) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['domain-review'],
              });
            }
